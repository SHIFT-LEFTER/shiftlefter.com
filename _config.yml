# ==========================================================================
# FROZEN CITATION CONTRACT (sl-5dhn; charter §1.5 — the flags must timestamp)
# --------------------------------------------------------------------------
# The permalink scheme is the ONE unmigratable thing on this site. Once the
# first real post publishes, /writing/YYYY/MM/slug/ URLs are frozen
# forever — generators and themes may change, URLs may not. Until that first
# publication event this line is a one-line flip.
# Amendment trail: ratified scheme was /YYYY/MM/slug/ (blog-platform.md,
# written when the blog was assumed a subdomain site); Shape C (one site at
# the apex) + the namespace rule below prefixed it with /blog; Chair exercised
# the pre-publication veto window 2026-08-12 (sl-0ewe): 'writing' over 'blog'
# — accommodates screeds, essays, posts; nothing was live under /blog/, so
# no redirects.
# ==========================================================================
permalink: /writing/:year/:month/:title/

# Pinned so a late-evening local post can never land in the wrong permanent
# /YYYY/MM/ month via a UTC build (GH Pages builds in UTC).
timezone: America/Chicago

title: ShiftLefter
author: Gabriel Wilkins
url: https://shiftlefter.com

# Explicit because jekyll-github-metadata otherwise infers the repo from the
# `origin` remote — which is the GitLab working remote here, not GitHub.
repository: SHIFT-LEFTER/shiftlefter.com

# Namespace rule (Shape C, ratified 2026-07-31; slug renamed sl-0ewe):
# /writing/* is the Jekyll posts surface; every other root path is free
# static content — Jekyll passes files without front matter through
# untouched, so anything parked outside /writing/ serves byte-identical.
plugins:
  - jekyll-feed
feed:
  path: writing/feed.xml

# GH Pages force-enables several convenience plugins; these settings switch
# off the ones that would break the passthrough guarantee by converting
# front-matter-less .md files into pages (verified locally against the same
# github-pages gem code the server runs).
theme: null
optional_front_matter:
  enabled: false
titles_from_headings:
  enabled: false
relative_links:
  enabled: false

markdown: kramdown
kramdown:
  # Chapter anchors are explicit frozen {#id} attributes only — spoke targets
  # are never auto-derived from titles (grooming ruling 2026-07-31). With
  # auto_ids off, a heading has an anchor exactly when one was deliberately
  # frozen onto it.
  auto_ids: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
